name: Build signed iOS release
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check and sync the course
        run: |
          npm ci
          npm test
          npm run sync
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install signing material
        env:
          IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ht-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ht-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ht-signing.keychain-db"
          printf '%s' "$IOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/ht.p12"
          security import "$RUNNER_TEMP/ht.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/ht-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ht-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ht-signing.keychain-db" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/harmony-trainer.mobileprovision"
      - name: Archive and export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p artifacts/ios-release
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/HarmonyTrainer.xcarchive" CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER='Harmony Trainer App Store' archive > "$RUNNER_TEMP/ht-archive.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ht-archive.log"; exit 1; }
          python3 - <<'PY'
          import os,plistlib
          with open(os.environ['RUNNER_TEMP']+'/ht-export.plist','wb') as f:
              plistlib.dump({'method':'app-store-connect','teamID':os.environ['APPLE_TEAM_ID'],'signingStyle':'manual','provisioningProfiles':{'com.studymusictheory.harmonytrainer':'Harmony Trainer App Store'},'uploadSymbols':True,'manageAppVersionAndBuildNumber':False},f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HarmonyTrainer.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ht-export.plist" -exportPath artifacts/ios-release > "$RUNNER_TEMP/ht-export.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ht-export.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-trainer-ios-signed
          path: artifacts/ios-release/
          retention-days: 30
      - name: Upload to App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_CONTENT" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file artifacts/ios-release/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ht-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/ht.p12" "$HOME/Library/MobileDevice/Provisioning Profiles/harmony-trainer.mobileprovision"
