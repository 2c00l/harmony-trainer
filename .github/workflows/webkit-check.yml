name: Check WebKit compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: Check microphone processing, recording and player
        run: |
          PORT=4173 node scripts/serve.mjs > /tmp/pitchsense-serve.log 2>&1 &
          node scripts/webkit-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-check
          path: artifacts/webkit/
